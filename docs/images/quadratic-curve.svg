<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Inter, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Votes grow with the square root of credits</title>
<desc id="d">votes = sqrt(credits). One whale spending 100,000 credits (100 SOL) gets 316.2 votes. One krill spending 1,000 credits (1 SOL) gets 31.6 votes, so eleven krill spending 11,000 credits in total get 347.9 votes and outvote the whale.</desc>
<defs><clipPath id="plot"><rect x="110" y="150" width="1190" height="540"/></clipPath></defs>
<rect x="0.5" y="0.5" width="1399" height="799" rx="16" fill="#fcfcfb" stroke="#e4e4df"/>
<text x="40" y="58" font-size="24" font-weight="600" fill="#24292f">Votes grow with the square root of credits</text>
<text x="40" y="86" font-size="15" fill="#57606a">votes = √credits, where 1 credit = 0.001 SOL. Splitting the same budget across more people always buys more votes.</text>
