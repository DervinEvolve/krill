[package]
name = "krill"
version = "0.1.0"
description = "Quadratic-voting DAO treasury with milestone escrow, in native SOL"
authors = ["DervinEvolve"]
license = "MIT"
repository = "https://github.com/DervinEvolve/krill"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "krill"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
# Embeds a security.txt in the program bytes (contact, policy, source).
solana-security-txt = "1.1.3"

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
proptest = "1"
# Decodes `Program data:` event logs in the security tests.
base64 = "0.21"
# Reads the embedded security.txt back out of the built program.
solana-security-txt = { version = "1.1.3", features = ["parser"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
